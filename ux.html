<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ux/ui — amanda sun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="site.js" defer></script>
    <style>
        body {
            padding: 100px 40px 60px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Projects */
        .intro {
            font-size: var(--size-body);
            font-weight: var(--weight-regular);
            color: var(--accent);
            max-width: 560px;
            margin-bottom: 80px;
        }

        .project {
            display: grid;
            grid-template-columns: 1fr 1.6fr;
            gap: 48px;
            align-items: start;
            margin-bottom: 120px;

            /* No media: let the text use the full width */
            &:not(:has(.project-media > *)) {
                grid-template-columns: 1fr;
            }
        }

        .project-text {
            position: sticky;
            top: 100px;
        }

        .project-name {
            font-size: clamp(14px, 2vw, 24px);
            color: var(--ink);
            font-weight: var(--weight-regular);
            margin-bottom: 8px;
        }

        .project-meta {
            font-size: var(--size-small);
            color: var(--accent);
            margin-bottom: 20px;
        }

        .project-description {
            font-size: clamp(12px, 1.3vw, 16px);
            color: var(--ink);
            font-weight: 300;
            line-height: 1.6;
            max-width: 60ch;
            text-wrap: pretty;

            & p + p {
                margin-top: 12px;
            }
        }

        .project-link {
            display: inline-block;
            margin-top: 20px;
            font-size: clamp(12px, 1.3vw, 16px);
        }

        .project-media {
            display: flex;
            flex-direction: column;
            gap: 24px;

            &.side-by-side {
                display: grid;
                grid-template-columns: 1fr 1fr;
                align-items: center;
            }

            & img,
            & video {
                width: 100%;
                height: auto;
                display: block;
            }
        }

        .media-caption {
            margin-top: 8px;
            font-size: clamp(11px, 1vw, 13px);
            color: var(--accent);
        }

        /* Mobile styles */
        @media (max-width: 768px) {
            body { padding: 80px 20px 40px; }
            .intro { margin-bottom: 48px; }
            .project {
                grid-template-columns: 1fr;
                gap: 20px;
                margin-bottom: 72px;
            }
            .project-text { position: static; }
            .project-name { font-size: 16px; }
            .project-description { font-size: 14px; }
            .project-link { font-size: 14px; }
            .media-caption { font-size: 12px; }
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#main">skip to content</a>

    <!-- Navigation Pane -->
    <nav id="nav-pane" aria-label="pages">
        <a href="ux.html" class="nav-item active" data-key="2" aria-keyshortcuts="2" aria-current="page">design</a>
        <a href="canvas.html" class="nav-item" data-key="3" aria-keyshortcuts="3">art</a>
        <a href="links.html" class="nav-item" data-key="4" aria-keyshortcuts="4">press</a>
    </nav>

    <!-- Signature -->
    <div id="signature"><a href="index.html" class="nav-item" data-key="1" aria-label="amanda sun: home" aria-keyshortcuts="1">amanda sun</a></div>

    <main id="main" class="container" tabindex="-1">
        <h1 class="intro">ux / ui</h1>
        <div id="projects"></div>
    </main>

    <script>
        // ========================================
        // CONFIGURE YOUR PROJECTS HERE
        // ========================================
        // name:        project title
        // meta:        role, company, year, tools (optional)
        // description: one string per paragraph
        // link:        { text, href } (optional)
        // media:       images, gifs, or videos (.mp4/.webm), each with an optional caption
        const projects = [
            {
                name: 'caltrain',
                meta: 'ios app concept',
                description: [
                    'when is my next train? an at-a-glance way for daily commuters to see the next caltrain.',
                ],
                link: { text: 'read more', href: 'caltrain.html' },
            },
            {
                name: 'block duplication',
                meta: 'squarespace',
                description: [
                    'design handoff and edge casing for duplicating blocks in the squarespace editor.',
                ],
                link: { text: 'read more', href: 'squarespace.html' },
                media: [
                    { src: 'imgs/animation/block dup.gif' },
                ],
            },
            {
                name: 'tree',
                meta: 'stanford billington laboratory · processing + esp32',
                description: [
                    'bringing the outdoors into windowless rooms: a sensor outside measures the wind, and a generative tree projected indoors sways to match.',
                ],
                link: { text: 'read more', href: 'billington.html' },
                mediaSideBySide: true,
                media: [
                    { src: 'imgs/billington/outside-trees.mp4', alt: 'trees outside moving in the wind', pauseButton: false },
                    { src: 'imgs/billington/tree-wind.mp4', alt: 'a generative tree swaying in the wind', onWhite: true, pauseButton: false },
                ],
            },
            // {
            //     name: 'project name',
            //     meta: 'role · company · year',
            //     description: [
            //         'the problem.',
            //         'what you did and what changed.',
            //     ],
            //     link: { text: 'read more', href: 'https://...' },
            //     mediaSideBySide: true,  // optional: media in a row instead of stacked
            //     media: [
            //         // onWhite: true blends a white background into the page
            //         // pauseButton: false hides a video's pause button (click still pauses)
            //         { src: 'imgs/ux/example.png', caption: 'final screens' },
            //     ],
            // },
        ];
        // ========================================

        const projectsEl = document.getElementById('projects');

        projects.forEach(project => {
            const projectEl = document.createElement('article');
            projectEl.className = 'project';

            const textEl = document.createElement('div');
            textEl.className = 'project-text';

            const nameEl = document.createElement('h2');
            nameEl.className = 'project-name';
            nameEl.textContent = project.name;
            textEl.appendChild(nameEl);

            if (project.meta) {
                const metaEl = document.createElement('div');
                metaEl.className = 'project-meta';
                metaEl.textContent = project.meta;
                textEl.appendChild(metaEl);
            }

            const descEl = document.createElement('div');
            descEl.className = 'project-description';
            (project.description || []).forEach(paragraph => {
                const p = document.createElement('p');
                p.textContent = paragraph;
                descEl.appendChild(p);
            });
            textEl.appendChild(descEl);

            if (project.link) {
                const linkEl = document.createElement('a');
                linkEl.className = 'project-link text-link';
                linkEl.href = project.link.href;
                linkEl.textContent = project.link.text + ' →';
                if (/^https?:/.test(project.link.href)) {
                    linkEl.target = '_blank';
                    const note = document.createElement('span');
                    note.className = 'visually-hidden';
                    note.textContent = ' (opens in a new tab)';
                    linkEl.appendChild(note);
                }
                textEl.appendChild(linkEl);
            }

            const mediaEl = document.createElement('div');
            mediaEl.className = 'project-media';
            if (project.mediaSideBySide) mediaEl.classList.add('side-by-side');
            (project.media || []).forEach(item => {
                const figure = document.createElement('div');
                let el;
                if (/\.(mp4|webm|mov)$/i.test(item.src)) {
                    el = document.createElement('video');
                    el.src = item.src;
                    el.autoplay = true;
                    el.loop = true;
                    el.muted = true;
                    el.playsInline = true;
                    el.setAttribute('aria-label', item.alt || item.caption || project.name);
                    if (item.pauseButton === false) el.dataset.noPauseButton = '';
                } else {
                    el = document.createElement('img');
                    el.src = item.src;
                    el.alt = item.alt || item.caption || project.name;
                    el.loading = 'lazy';
                }
                if (item.onWhite) el.classList.add('on-white');
                figure.appendChild(el);
                if (item.caption) {
                    const captionEl = document.createElement('div');
                    captionEl.className = 'media-caption';
                    captionEl.textContent = item.caption;
                    figure.appendChild(captionEl);
                }
                mediaEl.appendChild(figure);
            });

            projectEl.appendChild(textEl);
            projectEl.appendChild(mediaEl);
            projectsEl.appendChild(projectEl);
        });
    </script>
</body>
</html>
