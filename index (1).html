<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: white;
            font-family: nyt-imperial, georgia, 'times new roman', times, serif;
            min-height: 100vh;
        }

        /* Navigation */
        #nav-pane {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 16px;
            z-index: 100;
        }

        .nav-item {
            text-decoration: none;
            color: #607466;
            font-size: 12px;
            transition: color 0.2s;
            cursor: pointer;
        }

        .nav-item.active {
            color: #343E3D;
        }
    </style>
</head>
<body>
    <!-- Navigation Pane -->
    <nav id="nav-pane">
        <a href="index.html" class="nav-item active" data-key="1">1</a>
        <a href="canvas.html" class="nav-item" data-key="2">2</a>
    </nav>

    <script>
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                if (item.dataset.key === e.key) {
                    window.location.href = item.href;
                }
            });
        });
    </script>
</body>
</html>
