<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: white;
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Navigation */
        #nav-pane {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 16px;
            z-index: 100;
            line-height: 1;
        }
        .nav-item {
    text-decoration: none;
    color: #607466;
    font-size: clamp(14px, 2.5vw, 32px);
    transition: color 0.2s;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
}

#signature {
    position: fixed;
    top: 20px;
    right: 20px;
    color: #343E3D;
    font-size: clamp(14px, 2.5vw, 32px);
    font-family: 'DM Sans', sans-serif;
    z-index: 100;
    line-height: 1;
}

        .nav-item.active {
            color: #343E3D;
        }

        /* More info link */
        #more-info {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: #607466;
            font-size: clamp(10px, 1vw, 14px);
            font-family: 'DM Sans', sans-serif;
            z-index: 100;
            text-decoration: none;
            transition: color 0.2s;
        }

        #more-info:hover {
            color: #343E3D;
        }

        /* Mobile styles */
        @media (max-width: 768px) {
            .nav-item {
                font-size: 14px;
            }

            #signature {
                font-size: 14px;
            }

            #more-info {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation Pane -->
    <nav id="nav-pane">
        <a href="index.html" class="nav-item active" data-key="1">1</a>
        <a href="canvas.html" class="nav-item" data-key="2">2</a>
        <a href="links.html" class="nav-item" data-key="3">3</a>
    </nav>

    <!-- Signature -->
    <div id="signature">amanda sun</div>

    <!-- More info link -->
    <a id="more-info" href="http://byamandasun.com/code/billington" target="_blank">for more info</a>

    <script>
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                if (item.dataset.key === e.key) {
                    window.location.href = item.href;
                }
            });
        });
    </script>

    <script>
        let smoothedWind = 0;
        let transparency = 150;
        let leafColor, branchColor, skyColor;

        // Branch controls
        let treeNumber = 2;
        let nSegments, totalBranchLength, maxBranchThickness;
        let minBranchThickness, minSpawnDistance;
        let branchSpawnOdds, branchSpawnOddsOfSecond;
        let mindThetaSplit, maxdThetaSplit, maxdThetaWander, dBranchSize;

        // Leaf controls
        let minLength, maxLength, minWidth, maxWidth;
        let maxBranchSizeForLeaves, leafSpawnOdds;
        let branches = [];
        let pauseWind = false;
        let drawWind = false;
        let drawLeaves = true;

        // Wind variables
        let windDirection, windVelocity;
        let velIncrement, velOff = 0;
        let windspeedIncrement, windspeed = 0;
        let limit = 2.1;

        // Leaf outline
        let nLeafPoints = 12;
        let xOutline = [], yOutline = [];
        let tempx, tempy;

        function setup() {
            let cnv = createCanvas(windowWidth, windowHeight);
            cnv.parent(document.body);

            frameRate(30);
            leafColor = color(100, 100, 100, 240);
            branchColor = color(100, 100, 100);
            skyColor = color(255, 255, 255);

            initializeTreeValues();
            windDirection = 0;
            windVelocity = 0;
            velIncrement = random(0.01, 0.1);
            windspeedIncrement = random(0.1, 0.5);
            defineLeafOutline();
            generateBranches();
            redrawTrees();
        }

        function draw() {
            if (!pauseWind) {
                updateWind();
                for (let i = 0; i < treeNumber; i++) branches[i].rotateDueToWind();
                redrawTrees();
                drawControlPanel();
                if (drawWind) drawWindLine();
            } else {
                drawControlPanel();
            }
        }

        function redrawTrees() {
            background(skyColor);
            drawBranches();
            if (drawLeaves) drawLeavesFunc();
        }

        function drawBranches() {
            stroke(branchColor);
            for (let i = 0; i < treeNumber; i++) {
                branches[i].drawBranch([width / 2, height * 8/9]);
            }
        }

        function drawLeavesFunc() {
            noStroke();
            fill(leafColor);
            for (let i = 0; i < treeNumber; i++) {
                branches[i].drawLeaves([(1 + i) * (width / (1 + treeNumber)), height]);
            }
        }

        function drawWindLine() {
            stroke('#6e956c');
            strokeWeight(0.5);
            let dx = 200, dy = 85, lineLength = 150;
            line(dx, dy, dx + lineLength * windVelocity * cos(windDirection), dy + lineLength * windVelocity * sin(windDirection));
            noStroke();
            fill('#6e956c');
            ellipse(dx, dy, 8, 8);
        }

        function drawControlPanel() {
        // Smooth the wind value so it doesn't jump around
        smoothedWind = lerp(smoothedWind, windVelocity * 4, 0.05);
        
        textAlign(RIGHT, TOP);
        textFont('DM Sans');
        let fontSize = height * 0.016;
        textSize(fontSize);
        fill(150);
        let rightX = width - 20;
        let y = 25 + height * 0.05;
        text('tap or space to grow a new tree', rightX, y);
        y += fontSize * 2;
        text('wind: ' + smoothedWind.toFixed(1) + ' mph', rightX, y);
    }
        function initializeTreeValues() {
            pauseWind = false;
            drawWind = false;
            drawLeaves = true;

            const isMobile = windowWidth <= 768;
            nSegments = Math.max(Math.round(windowHeight * 0.02), 7);
            totalBranchLength = isMobile ? windowHeight * 0.5 : windowWidth * 0.4;
            maxBranchThickness = isMobile ? windowWidth * 0.01 : windowWidth * 0.006;
            maxBranchSizeForLeaves = 5;
            minBranchThickness = 2;
            minSpawnDistance = 0.1;
            branchSpawnOdds = isMobile ? 0.7 : 0.3;
            branchSpawnOddsOfSecond = isMobile ? 0.5 : 0;
            mindThetaSplit = 0;
            maxdThetaSplit = PI / 5;
            maxdThetaWander = isMobile ? PI / 8 : PI / 5;
            dBranchSize = 0.2;
            minLength = 3;
            maxLength = 20;
            minWidth = 0.4;
            maxWidth = 0.5;
            leafSpawnOdds = 1.0;
            transparency = 240;
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            initializeTreeValues();
            generateBranches();
            redrawTrees();
        }

        function touchStarted() {
            if (touches.length > 0) {
                const touchY = touches[0].y;
                if (touchY < 60 || touchY > windowHeight - 60) return true;
                generateBranches();
                windDirection = random(TWO_PI);
                redrawTrees();
                return false;
            }
        }

        function keyPressed() {
            if (key === ' ') { generateBranches(); windDirection = random(TWO_PI); redrawTrees(); }
            if (keyCode === UP_ARROW && !pauseWind && windVelocity < 8) { windVelocity++; windspeed++; }
            if (keyCode === DOWN_ARROW && !pauseWind && windVelocity > 0 && windspeed > 1) {
                windVelocity += 0.5; windspeed -= 0.5;
                if (windspeed < 0.5) pauseWind = !pauseWind;
            }
            if (keyCode === LEFT_ARROW) windDirection = (windDirection - 0.1 + TWO_PI) % TWO_PI;
            if (keyCode === RIGHT_ARROW) windDirection = (windDirection + 0.1) % TWO_PI;
            if (key === '1') window.location.href = 'index.html';
            if (key === '2') window.location.href = 'canvas.html';
            if (key === '3') window.location.href = 'links.html';
            redrawTrees();
        }

        function keyTyped() {
            if (key === 'm') drawWind = !drawWind;
            if (key === 'l') drawLeaves = !drawLeaves;
            if (key === 'p') { pauseWind = !pauseWind; if (pauseWind) windVelocity = 0; }
            if (key === '=' && transparency < 240) { transparency += 10; leafColor = color(100, 100, 100, transparency); }
            if (key === '-' && transparency > 0) { transparency -= 10; leafColor = color(100, 100, 100, transparency); }
            redrawTrees();
        }

        function generateBranches() {
            branches = [];
            for (let i = 0; i < treeNumber; i++) {
                branches[i] = new Branch(-1, 3 * PI / 2, totalBranchLength, maxBranchThickness);
            }
        }

        class Branch {
            constructor(indexO, thetaI, totalLength, startingThicknessO) {
                this.index = indexO;
                this.myChildren = [];
                this.myLeaves = [];
                this.segmentLength = totalLength / nSegments;
                this.startingThickness = startingThicknessO;
                this.thetaO = thetaI;
                this.thetas = new Array(nSegments);
                this.thetas[0] = this.thetaO;
                this.x = 0;
                this.y = 0;

                for (let i = 1; i < nSegments; i++) {
                    this.thetas[i] = this.thetas[i - 1] + random(-maxdThetaWander, maxdThetaWander);
                }

                for (let i = 1; i < nSegments; i++) {
                    if (startingThicknessO * (1 - i / nSegments) > minBranchThickness &&
                        i / nSegments > minSpawnDistance && random(1) <= branchSpawnOdds) {
                        let dThetaSign = randomSign();
                        this.myChildren.push(new Branch(i,
                            this.thetas[i] + dThetaSign * random(mindThetaSplit, maxdThetaSplit),
                            totalLength * (1 - i / nSegments) * random(1 - dBranchSize, 1 + dBranchSize),
                            startingThicknessO * (1 - i / nSegments)));
                        if (random(1) <= branchSpawnOddsOfSecond) {
                            this.myChildren.push(new Branch(i,
                                this.thetas[i] - dThetaSign * random(mindThetaSplit, maxdThetaSplit),
                                totalLength * (1 - i / nSegments) * random(1 - dBranchSize, 1 + dBranchSize),
                                startingThicknessO * (1 - i / nSegments)));
                        }
                    }
                }

                for (let i = 1; i < nSegments; i++) {
                    if (startingThicknessO * (1 - i / nSegments) < maxBranchSizeForLeaves && random(1) < leafSpawnOdds) {
                        this.myLeaves.push(new Leaf(this.thetas[i], i));
                    }
                }
            }

            getCoordsOf(n) {
                let x2 = this.x, y2 = this.y;
                for (let i = 0; i < n; i++) {
                    x2 += this.segmentLength * cos(this.thetas[i]);
                    y2 += this.segmentLength * sin(this.thetas[i]);
                }
                return [x2, y2];
            }

            rotate(dTheta) {
                for (let i = 0; i < nSegments; i++) this.thetas[i] += dTheta;
                for (let leaf of this.myLeaves) leaf.rotate(dTheta);
                for (let child of this.myChildren) child.rotate(dTheta);
            }

            rotateDueToWind() {
                let dThetaWind = this.thetas[0] - windDirection;
                if (dThetaWind > PI) dThetaWind = -(TWO_PI - dThetaWind);
                else if (dThetaWind < -PI) dThetaWind = TWO_PI + dThetaWind;

                let forceOfBranch = -(this.thetas[0] - this.thetaO) * ((this.startingThickness / maxBranchThickness) * 1.1);
                let forceOfWind = -windVelocity * sin(dThetaWind) / 10;
                let moveAmount = noise(random(16, 24)) * 50;
                this.rotate((forceOfBranch + forceOfWind) / moveAmount);

                for (let leaf of this.myLeaves) leaf.moveFromWind();
                for (let child of this.myChildren) child.rotateDueToWind();
            }

            drawBranch(coords) {
                this.x = coords[0]; this.y = coords[1];
                let x1 = this.x, y1 = this.y, x2, y2;
                for (let i = 0; i < nSegments; i++) {
                    x2 = x1 + this.segmentLength * cos(this.thetas[i]);
                    y2 = y1 + this.segmentLength * sin(this.thetas[i]);
                    strokeWeight(this.startingThickness * (1 - i / nSegments));
                    line(x1, y1, x2, y2);
                    x1 = x2; y1 = y2;
                }
                for (let child of this.myChildren) child.drawBranch(this.getCoordsOf(child.index));
            }

            drawLeaves(coords) {
                for (let leaf of this.myLeaves) leaf.draw(this.getCoordsOf(leaf.index));
                for (let child of this.myChildren) child.drawLeaves(coords);
            }
        }

        class Leaf {
            constructor(thetaBranch, indexO) {
                this.thetaO = thetaBranch + randomSign() * random(PI / 6, PI / 3);
                this.dTheta = 0;
                this.myWidth = random(minWidth, maxWidth);
                this.myLength = random(minLength, maxLength);
                this.index = indexO;
            }

            moveFromWind() {
                let dThetaWind = ((this.thetaO + this.dTheta) - windDirection) % TWO_PI;
                if (dThetaWind > PI) dThetaWind = -(TWO_PI - dThetaWind);
                else if (dThetaWind < -PI) dThetaWind = TWO_PI + dThetaWind;
                this.thetaO = (this.thetaO + TWO_PI) % TWO_PI;
                let forceOfLeaf = -(this.dTheta) / PI;
                let forceOfWind = -windVelocity * sin(dThetaWind);
                let LeafForce = noise(random(20, 30)) * 30;
                this.dTheta += (forceOfLeaf + forceOfWind) / LeafForce;
            }

            rotate(deltaTheta) { this.dTheta += deltaTheta; }

            draw(coord) {
                let x = coord[0], y = coord[1];
                let LeafJitter = -windVelocity * sin(((this.thetaO + this.dTheta) - windDirection) % TWO_PI);
                drawLeaf(x, y, this.myLength, this.myWidth, (this.thetaO + this.dTheta) + random(LeafJitter) * 0.5);
            }
        }

        function randomSign() {
            let num = random(-1, 1);
            return num === 0 ? -1 : num / abs(num);
        }

        function defineLeafOutline() {
            xOutline = new Array(nLeafPoints);
            yOutline = new Array(nLeafPoints);
            for (let i = 0; i <= nLeafPoints / 2; i++) {
                xOutline[i] = 2 * i / nLeafPoints;
                yOutline[i] = -pow(xOutline[i] - 0.5, 2) + 0.25;
                if (i > 0 && i <= nLeafPoints / 2) {
                    xOutline[nLeafPoints - i] = xOutline[i];
                    yOutline[nLeafPoints - i] = -yOutline[i];
                }
            }
        }

        function drawLeaf(x, y, leafLength, leafWidth, direction) {
            beginShape();
            for (let i = 0; i < xOutline.length; i++) {
                tempx = xOutline[i] * cos(direction) * leafLength - yOutline[i] * sin(direction) * leafWidth * leafLength;
                tempy = xOutline[i] * sin(direction) * leafLength + yOutline[i] * cos(direction) * leafWidth * leafLength;
                vertex(x + tempx, y + tempy);
            }
            endShape(CLOSE);
        }

        function updateWind() {
            velOff += velIncrement;
            windspeed += windspeedIncrement;
            windDirection = (windDirection - 0.001 + TWO_PI) % TWO_PI;
            if (windspeed >= limit) windspeed -= windspeedIncrement;
            windVelocity = windspeed * noise(velOff) - 1;
        }
    </script>
</body>
</html>
