<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>amanda sun</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="site.js" defer></script>
    <style>
        body {
            overflow: hidden;
        }

        main canvas {
            display: block;
        }

        /* More info link */
        #more-info {
            position: fixed;
            bottom: var(--gutter);
            right: var(--gutter);
            font-size: var(--size-small);
            z-index: 100;
        }

        /* Wind slider: vertical, so it matches swiping up and down */
        #wind-control {
            position: fixed;
            right: var(--gutter);
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            font-size: var(--size-small);
            color: #767676;
        }

        /* A thin rounded bar that fills with the wind. --value is set from the
           wind speed (0 to 1). The knob is invisible, but still what you drag */
        #wind-speed {
            --knob: 28px;
            --value: 0;
            --fill: calc(100% * var(--value));
            -webkit-appearance: none;
            appearance: none;
            writing-mode: vertical-lr;
            direction: rtl;
            height: clamp(80px, 20vh, 160px);
            width: var(--knob);
            margin: 0;
            background: none;
            cursor: grab;

            &:active {
                cursor: grabbing;
            }

            &::-webkit-slider-runnable-track {
                width: 4px;
                height: 100%;
                border-radius: 2px;
                background: linear-gradient(to top, var(--accent) var(--fill), rgb(120 120 128 / 0.24) var(--fill));
            }

            &::-moz-range-track {
                width: 4px;
                height: 100%;
                border-radius: 2px;
                background: linear-gradient(to top, var(--accent) var(--fill), rgb(120 120 128 / 0.24) var(--fill));
            }

            &::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: var(--knob);
                height: var(--knob);
                margin-left: -12px; /* centers the knob on the 4px track */
                background: transparent;
            }

            &::-moz-range-thumb {
                width: var(--knob);
                height: var(--knob);
                border: none;
                background: transparent;
            }
        }

        #wind-output {
            font-variant-numeric: tabular-nums;
            line-height: 1.2;
            text-align: center;
            white-space: pre-line; /* the number, with "mph" on the line below */
        }

        /* Plain text, with its 4px padding keeping it level with the other bottom text */
        #motion-toggle {
            position: fixed;
            bottom: calc(var(--gutter) - 4px);
            left: var(--gutter);
            z-index: 100;
            padding: 4px 0;
            border: none;
            background: none;
        }

        /* Bottom center. Clicks pass through to the trees */
        #new-tree-hint {
            position: fixed;
            bottom: var(--gutter);
            left: 50%;
            translate: -50% 0;
            z-index: 100;
            font-size: var(--size-small);
            color: #767676; /* 4.5:1 on white (WCAG AA) */
            white-space: nowrap;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#main">skip to content</a>

    <!-- Navigation Pane -->
    <nav id="nav-pane" aria-label="pages">
        <a href="ux.html" class="nav-item" data-key="2" aria-keyshortcuts="2">design</a>
        <a href="canvas.html" class="nav-item" data-key="3" aria-keyshortcuts="3">art</a>
        <a href="links.html" class="nav-item" data-key="4" aria-keyshortcuts="4">press</a>
    </nav>

    <!-- Signature -->
    <h1 id="signature"><a href="index.html" class="nav-item" data-key="1" aria-label="amanda sun: home" aria-keyshortcuts="1" aria-current="page">amanda sun</a></h1>

    <main id="main" tabindex="-1">
        <p class="visually-hidden">
            A generative drawing of two trees whose branches and leaves sway in the wind.
            Press space or tap to grow new trees. Use the wind slider, or swipe up and down, to change the wind.
        </p>
    </main>

    <div id="wind-control">
        <label for="wind-speed" class="visually-hidden">wind speed</label>
        <input id="wind-speed" type="range" min="0" max="30" step="1" value="4" aria-valuetext="4 mph">
        <output id="wind-output" for="wind-speed">4 mph</output>
    </div>

    <button id="motion-toggle" class="motion-toggle" type="button" aria-pressed="false">pause</button>

    <p id="new-tree-hint"></p>

    <!-- More info link -->
    <a id="more-info" class="text-link" href="billington.html" target="_blank">for more info<span class="visually-hidden"> about the tree sketch (opens in a new tab)</span></a>

    <script>
        let transparency = 150;
        let leafColor, branchColor, skyColor;

        // Branch controls
        let treeNumber = 2;
        let nSegments, totalBranchLength, maxBranchThickness;
        let minBranchThickness, minSpawnDistance;
        let branchSpawnOdds, branchSpawnOddsOfSecond;
        let mindThetaSplit, maxdThetaSplit, maxdThetaWander, dBranchSize;

        // Leaf controls
        let minLength, maxLength, minWidth, maxWidth;
        let maxBranchSizeForLeaves, leafSpawnOdds;
        let branches = [];
        let drawWind = false;
        let drawLeaves = true;

        // Wind variables
        let windDirection, windVelocity;

        // Leaf outline
        let nLeafPoints = 12;
        let xOutline = [], yOutline = [];
        let tempx, tempy;

        function setup() {
            let cnv = createCanvas(windowWidth, windowHeight);
            cnv.parent('main');
            // Described for screen readers by the text in <main>
            cnv.elt.setAttribute('aria-hidden', 'true');

            frameRate(30);
            leafColor = color(100, 100, 100, 240);
            branchColor = color(100, 100, 100);
            skyColor = color(255, 255, 255);

            initializeTreeValues();
            windDirection = 0;
            windVelocity = 0;
            defineLeafOutline();
            generateBranches();
            redrawTrees();
        }

        // Wind speed comes from the slider (or swiping up/down on the trees)
        const MPH_PER_UNIT = 4;
        const windSlider = document.getElementById('wind-speed');
        const windOutput = document.getElementById('wind-output');
        let targetMph = Number(windSlider.value);

        function setWindMph(mph) {
            targetMph = Math.min(Math.max(Math.round(mph), Number(windSlider.min)), Number(windSlider.max));
            windSlider.value = targetMph;
            windOutput.textContent = targetMph + '\nmph';
            windSlider.setAttribute('aria-valuetext', targetMph + ' mph');
            windSlider.style.setProperty('--value', targetMph / Number(windSlider.max));
        }
        setWindMph(targetMph);
        windSlider.addEventListener('input', () => setWindMph(Number(windSlider.value)));

        // Trackpad swipe / scroll wheel: swiping up raises the wind
        let wheelMph = targetMph;
        window.addEventListener('wheel', (e) => {
            if (e.target.closest('#wind-control, a, button')) return;
            wheelMph = Math.min(Math.max(wheelMph + e.deltaY / 40, 0), Number(windSlider.max));
            if (Math.round(wheelMph) !== targetMph) setWindMph(wheelMph);
        }, { passive: true });
        windSlider.addEventListener('input', () => { wheelMph = targetMph; });

        // Pause button (WCAG 2.2.2); starts paused if the system asks for reduced motion
        let motionPaused = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const motionToggle = document.getElementById('motion-toggle');

        function setMotionPaused(paused) {
            motionPaused = paused;
            motionToggle.textContent = paused ? 'play' : 'pause';
            motionToggle.setAttribute('aria-pressed', String(paused));
        }
        setMotionPaused(motionPaused);
        motionToggle.addEventListener('click', () => setMotionPaused(!motionPaused));

        function draw() {
            if (!motionPaused) {
                updateWind();
                for (let i = 0; i < treeNumber; i++) branches[i].rotateDueToWind();
            }
            redrawTrees();
            if (drawWind) drawWindLine();
        }

        function redrawTrees() {
            background(skyColor);
            drawBranches();
            if (drawLeaves) drawLeavesFunc();
        }

        function drawBranches() {
            stroke(branchColor);
            for (let i = 0; i < treeNumber; i++) {
                branches[i].drawBranch([width / 2, height * 8/9]);
            }
        }

        function drawLeavesFunc() {
            noStroke();
            fill(leafColor);
            for (let i = 0; i < treeNumber; i++) {
                branches[i].drawLeaves([(1 + i) * (width / (1 + treeNumber)), height]);
            }
        }

        function drawWindLine() {
            stroke('#6e956c');
            strokeWeight(0.5);
            let dx = 200, dy = 85, lineLength = 150;
            line(dx, dy, dx + lineLength * windVelocity * cos(windDirection), dy + lineLength * windVelocity * sin(windDirection));
            noStroke();
            fill('#6e956c');
            ellipse(dx, dy, 8, 8);
        }

        // Touchscreens without a mouse/trackpad (iPhone, iPad) get the tap hint
        const touchOnly = window.matchMedia('(hover: none) and (pointer: coarse)');

        document.getElementById('new-tree-hint').textContent =
            touchOnly.matches ? 'tap for new tree' : 'hit space bar for new tree';

        function initializeTreeValues() {
            drawWind = false;
            drawLeaves = true;

            const isMobile = windowWidth <= 768;
            // Branches and leaves multiply with both of these, so they're capped:
            // a large, narrow window otherwise grows millions of leaves
            nSegments = Math.min(Math.max(Math.round(windowHeight * 0.02), 7), 22);
            totalBranchLength = isMobile ? windowHeight * 0.5 : windowWidth * 0.4;
            maxBranchThickness = isMobile ? Math.min(windowWidth * 0.01, 4) : windowWidth * 0.006;
            maxBranchSizeForLeaves = 5;
            minBranchThickness = 2;
            minSpawnDistance = 0.1;
            branchSpawnOdds = isMobile ? 0.7 : 0.3;
            branchSpawnOddsOfSecond = isMobile ? 0.5 : 0;
            mindThetaSplit = 0;
            maxdThetaSplit = PI / 5;
            maxdThetaWander = isMobile ? PI / 8 : PI / 5;
            dBranchSize = 0.2;
            minLength = 3;
            maxLength = 20;
            minWidth = 0.4;
            maxWidth = 0.5;
            leafSpawnOdds = 1.0;
            transparency = 240;
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            initializeTreeValues();
            generateBranches();
            redrawTrees();
        }

        const SWIPE_PX_PER_MPH = 12;
        let touchStartY = null, touchStartMph = 0, swiping = false;

        function onTrees(event) {
            return event && event.target && event.target.tagName === 'CANVAS';
        }

        function touchStarted(event) {
            if (!onTrees(event) || touches.length === 0) return true;
            touchStartY = touches[0].y;
            touchStartMph = targetMph;
            swiping = false;
            return false;
        }

        function touchMoved(event) {
            if (touchStartY === null || touches.length === 0) return true;
            const dy = touchStartY - touches[0].y; // up is positive
            if (Math.abs(dy) > 10) swiping = true;
            if (swiping) setWindMph(touchStartMph + dy / SWIPE_PX_PER_MPH);
            return false;
        }

        function touchEnded(event) {
            if (touchStartY === null) return true;
            if (!swiping) {
                generateBranches();
                windDirection = random(TWO_PI);
                redrawTrees();
            }
            touchStartY = null;
            return false;
        }

        function keyPressed() {
            // Leave keys alone while a button or link has focus (space would press it)
            if (document.activeElement && document.activeElement.closest('a, button, input')) return;
            if (key === ' ') { generateBranches(); windDirection = random(TWO_PI); redrawTrees(); }
            if (keyCode === UP_ARROW) setWindMph(targetMph + 1);
            if (keyCode === DOWN_ARROW) setWindMph(targetMph - 1);
            if (keyCode === LEFT_ARROW) windDirection = (windDirection - 0.1 + TWO_PI) % TWO_PI;
            if (keyCode === RIGHT_ARROW) windDirection = (windDirection + 0.1) % TWO_PI;
            redrawTrees();
        }

        function keyTyped() {
            if (document.activeElement && document.activeElement.closest('a, button, input')) return;
            if (key === 'm') drawWind = !drawWind;
            if (key === 'l') drawLeaves = !drawLeaves;
            if (key === 'p') motionToggle.click();
            if (key === '=' && transparency < 240) { transparency += 10; leafColor = color(100, 100, 100, transparency); }
            if (key === '-' && transparency > 0) { transparency -= 10; leafColor = color(100, 100, 100, transparency); }
            redrawTrees();
        }

        function generateBranches() {
            branches = [];
            for (let i = 0; i < treeNumber; i++) {
                branches[i] = new Branch(-1, 3 * PI / 2, totalBranchLength, maxBranchThickness);
            }
        }

        class Branch {
            constructor(indexO, thetaI, totalLength, startingThicknessO) {
                this.index = indexO;
                this.myChildren = [];
                this.myLeaves = [];
                this.segmentLength = totalLength / nSegments;
                this.startingThickness = startingThicknessO;
                this.thetaO = thetaI;
                this.thetas = new Array(nSegments);
                this.thetas[0] = this.thetaO;
                this.x = 0;
                this.y = 0;

                for (let i = 1; i < nSegments; i++) {
                    this.thetas[i] = this.thetas[i - 1] + random(-maxdThetaWander, maxdThetaWander);
                }

                for (let i = 1; i < nSegments; i++) {
                    if (startingThicknessO * (1 - i / nSegments) > minBranchThickness &&
                        i / nSegments > minSpawnDistance && random(1) <= branchSpawnOdds) {
                        let dThetaSign = randomSign();
                        this.myChildren.push(new Branch(i,
                            this.thetas[i] + dThetaSign * random(mindThetaSplit, maxdThetaSplit),
                            totalLength * (1 - i / nSegments) * random(1 - dBranchSize, 1 + dBranchSize),
                            startingThicknessO * (1 - i / nSegments)));
                        if (random(1) <= branchSpawnOddsOfSecond) {
                            this.myChildren.push(new Branch(i,
                                this.thetas[i] - dThetaSign * random(mindThetaSplit, maxdThetaSplit),
                                totalLength * (1 - i / nSegments) * random(1 - dBranchSize, 1 + dBranchSize),
                                startingThicknessO * (1 - i / nSegments)));
                        }
                    }
                }

                for (let i = 1; i < nSegments; i++) {
                    if (startingThicknessO * (1 - i / nSegments) < maxBranchSizeForLeaves && random(1) < leafSpawnOdds) {
                        this.myLeaves.push(new Leaf(this.thetas[i], i));
                    }
                }
            }

            getCoordsOf(n) {
                let x2 = this.x, y2 = this.y;
                for (let i = 0; i < n; i++) {
                    x2 += this.segmentLength * cos(this.thetas[i]);
                    y2 += this.segmentLength * sin(this.thetas[i]);
                }
                return [x2, y2];
            }

            rotate(dTheta) {
                for (let i = 0; i < nSegments; i++) this.thetas[i] += dTheta;
                for (let leaf of this.myLeaves) leaf.rotate(dTheta);
                for (let child of this.myChildren) child.rotate(dTheta);
            }

            rotateDueToWind() {
                let dThetaWind = this.thetas[0] - windDirection;
                if (dThetaWind > PI) dThetaWind = -(TWO_PI - dThetaWind);
                else if (dThetaWind < -PI) dThetaWind = TWO_PI + dThetaWind;

                let forceOfBranch = -(this.thetas[0] - this.thetaO) * ((this.startingThickness / maxBranchThickness) * 1.1);
                let forceOfWind = -windVelocity * sin(dThetaWind) / 10;
                let moveAmount = noise(random(16, 24)) * 50;
                this.rotate((forceOfBranch + forceOfWind) / moveAmount);

                for (let leaf of this.myLeaves) leaf.moveFromWind();
                for (let child of this.myChildren) child.rotateDueToWind();
            }

            drawBranch(coords) {
                this.x = coords[0]; this.y = coords[1];
                let x1 = this.x, y1 = this.y, x2, y2;
                for (let i = 0; i < nSegments; i++) {
                    x2 = x1 + this.segmentLength * cos(this.thetas[i]);
                    y2 = y1 + this.segmentLength * sin(this.thetas[i]);
                    strokeWeight(this.startingThickness * (1 - i / nSegments));
                    line(x1, y1, x2, y2);
                    x1 = x2; y1 = y2;
                }
                for (let child of this.myChildren) child.drawBranch(this.getCoordsOf(child.index));
            }

            drawLeaves(coords) {
                for (let leaf of this.myLeaves) leaf.draw(this.getCoordsOf(leaf.index));
                for (let child of this.myChildren) child.drawLeaves(coords);
            }
        }

        class Leaf {
            constructor(thetaBranch, indexO) {
                this.thetaO = thetaBranch + randomSign() * random(PI / 6, PI / 3);
                this.dTheta = 0;
                this.myWidth = random(minWidth, maxWidth);
                this.myLength = random(minLength, maxLength);
                this.index = indexO;
            }

            moveFromWind() {
                let dThetaWind = ((this.thetaO + this.dTheta) - windDirection) % TWO_PI;
                if (dThetaWind > PI) dThetaWind = -(TWO_PI - dThetaWind);
                else if (dThetaWind < -PI) dThetaWind = TWO_PI + dThetaWind;
                this.thetaO = (this.thetaO + TWO_PI) % TWO_PI;
                let forceOfLeaf = -(this.dTheta) / PI;
                let forceOfWind = -windVelocity * sin(dThetaWind);
                let LeafForce = noise(random(20, 30)) * 30;
                this.dTheta += (forceOfLeaf + forceOfWind) / LeafForce;
            }

            rotate(deltaTheta) { this.dTheta += deltaTheta; }

            draw(coord) {
                let x = coord[0], y = coord[1];
                let LeafJitter = -windVelocity * sin(((this.thetaO + this.dTheta) - windDirection) % TWO_PI);
                drawLeaf(x, y, this.myLength, this.myWidth, (this.thetaO + this.dTheta) + random(LeafJitter) * 0.5);
            }
        }

        function randomSign() {
            let num = random(-1, 1);
            return num === 0 ? -1 : num / abs(num);
        }

        function defineLeafOutline() {
            xOutline = new Array(nLeafPoints);
            yOutline = new Array(nLeafPoints);
            for (let i = 0; i <= nLeafPoints / 2; i++) {
                xOutline[i] = 2 * i / nLeafPoints;
                yOutline[i] = -pow(xOutline[i] - 0.5, 2) + 0.25;
                if (i > 0 && i <= nLeafPoints / 2) {
                    xOutline[nLeafPoints - i] = xOutline[i];
                    yOutline[nLeafPoints - i] = -yOutline[i];
                }
            }
        }

        function drawLeaf(x, y, leafLength, leafWidth, direction) {
            beginShape();
            for (let i = 0; i < xOutline.length; i++) {
                tempx = xOutline[i] * cos(direction) * leafLength - yOutline[i] * sin(direction) * leafWidth * leafLength;
                tempy = xOutline[i] * sin(direction) * leafLength + yOutline[i] * cos(direction) * leafWidth * leafLength;
                vertex(x + tempx, y + tempy);
            }
            endShape(CLOSE);
        }

        function updateWind() {
            windDirection = (windDirection - 0.001 + TWO_PI) % TWO_PI;
            // Ease toward the chosen speed so changes feel like a gust, not a jump
            windVelocity = lerp(windVelocity, targetMph / MPH_PER_UNIT, 0.05);
        }
    </script>
</body>
</html>
