<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>{{TITLE}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: white;
            font-family: 'DM Sans', sans-serif;
            padding: 100px 40px 60px;
            min-height: 100vh;
        }

        /* Navigation */
        #nav-pane {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 16px;
            z-index: 100;
            line-height: 1;
        }

        .nav-item {
            text-decoration: none;
            color: #607466;
            font-size: clamp(14px, 2.5vw, 32px);
            font-family: 'DM Sans', sans-serif;
            transition: color 0.2s;
            cursor: pointer;
        }

        .nav-item.active {
            color: #343E3D;
        }

        /* Signature */
        #signature {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #343E3D;
            font-size: clamp(14px, 2.5vw, 32px);
            font-family: 'DM Sans', sans-serif;
            z-index: 100;
            line-height: 1;
        }

        /* Lock screen */
        #lock {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #lock form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        #lock label {
            font-size: clamp(12px, 1.5vw, 18px);
            color: #343E3D;
        }

        #password {
            font-family: 'DM Sans', sans-serif;
            font-size: 16px;
            color: #343E3D;
            border: none;
            border-bottom: 1px solid #607466;
            padding: 6px 2px;
            width: 220px;
            text-align: center;
            outline: none;
            background: transparent;
        }

        #password:focus {
            border-bottom-color: #343E3D;
        }

        #lock-message {
            font-size: clamp(11px, 1.1vw, 14px);
            color: #607466;
            min-height: 1.2em;
        }

        #lock button {
            font-family: 'DM Sans', sans-serif;
            font-size: clamp(12px, 1.3vw, 16px);
            color: #607466;
            background: none;
            border: none;
            cursor: pointer;
            transition: color 0.2s;
        }

        #lock button:hover {
            color: #343E3D;
        }

        #content[hidden], #lock[hidden] {
            display: none;
        }

        /* Mobile styles */
        @media (max-width: 768px) {
            body { padding: 80px 20px 40px; }
            .nav-item { font-size: 14px; }
            #signature { font-size: 14px; }
        }
    </style>
</head>
<body>
    <!-- Navigation Pane -->
    <nav id="nav-pane">
        <a href="index.html" class="nav-item" data-key="1">1</a>
        <a href="canvas.html" class="nav-item" data-key="2">2</a>
        <a href="ux.html" class="nav-item active" data-key="3">3</a>
        <a href="links.html" class="nav-item" data-key="4">4</a>
    </nav>

    <!-- Signature -->
    <div id="signature">amanda sun</div>

    <div id="lock">
        <form id="lock-form">
            <label for="password">this project is password protected</label>
            <input id="password" type="password" autocomplete="current-password" autofocus>
            <button type="submit">enter →</button>
            <div id="lock-message"></div>
        </form>
    </div>

    <div id="content" hidden></div>

    <script>
        // Generated by tools/encrypt.py — do not edit by hand.
        const ENC = {{ENC}};

        const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
        const storageKey = 'unlock:' + ENC.salt;

        async function deriveKey(password) {
            const base = await crypto.subtle.importKey(
                'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
            return crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: b64(ENC.salt), iterations: ENC.iterations, hash: 'SHA-256' },
                base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
        }

        async function decrypt(key, iv, data) {
            return crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
        }

        // Media is stored as encrypted base64 in .js files, loaded with script tags
        // so it also works when the page is opened straight from disk (file://)
        const mediaWaiting = {};
        window.__lockedMedia = (id, data) => mediaWaiting[id] && mediaWaiting[id](data);

        function fetchMedia(entry) {
            return new Promise((resolve, reject) => {
                mediaWaiting[entry.id] = resolve;
                const script = document.createElement('script');
                script.src = entry.file;
                script.onerror = reject;
                document.body.appendChild(script);
            });
        }

        // One load per file, shared by every element that uses it
        const mediaUrls = {};
        function loadMedia(key, entry) {
            mediaUrls[entry.id] = mediaUrls[entry.id] || (async () => {
                const buf = b64(await fetchMedia(entry));
                const plain = await decrypt(key, buf.slice(0, 12), buf.slice(12));
                return URL.createObjectURL(new Blob([plain], { type: entry.type }));
            })();
            return mediaUrls[entry.id];
        }

        async function unlock(key) {
            const plain = await decrypt(key, b64(ENC.iv), b64(ENC.ct));
            const payload = JSON.parse(new TextDecoder().decode(plain));

            const content = document.getElementById('content');
            content.innerHTML = payload.html;
            document.getElementById('lock').hidden = true;
            content.hidden = false;

            const show = async el => {
                const entry = payload.media[el.dataset.src];
                if (!entry) return;
                try {
                    el.src = await loadMedia(key, entry);
                    if (el.tagName === 'VIDEO') el.play().catch(() => {});
                } catch (err) {
                    console.error('could not load', el.dataset.src, err);
                }
            };

            // Videos are heavy: load each one only as it scrolls near the screen
            const nearScreen = new IntersectionObserver(entries => {
                entries.forEach(e => {
                    if (!e.isIntersecting) return;
                    nearScreen.unobserve(e.target);
                    show(e.target);
                });
            }, { rootMargin: '100% 0px' });

            content.querySelectorAll('[data-src]').forEach(el => {
                if (el.tagName === 'VIDEO') nearScreen.observe(el);
                else show(el);
            });
        }

        // Stay unlocked for the rest of the browser session
        (async () => {
            try {
                const saved = sessionStorage.getItem(storageKey);
                if (!saved) return;
                const key = await crypto.subtle.importKey(
                    'raw', b64(saved), 'AES-GCM', true, ['decrypt']);
                await unlock(key);
            } catch (e) {}
        })();

        document.getElementById('lock-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('password');
            const message = document.getElementById('lock-message');
            message.textContent = '';
            try {
                const key = await deriveKey(input.value);
                await unlock(key);
                try {
                    const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
                    sessionStorage.setItem(storageKey, btoa(String.fromCharCode(...raw)));
                } catch (e) {}
            } catch (err) {
                message.textContent = 'wrong password';
                input.select();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            document.querySelectorAll('.nav-item').forEach(item => {
                if (item.dataset.key === e.key) window.location.href = item.href;
            });
        });
    </script>
</body>
</html>
