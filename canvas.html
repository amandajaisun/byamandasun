    <style>
        body {
            overflow: hidden;
            cursor: grab;
            user-select: none;
        }

        body.grabbing {
            cursor: grabbing;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        #canvas {
            width: 4000px;
            height: 4000px;
            position: absolute;
            top: 0;
            left: 0;
            transition: transform 0.05s ease-out;
            transform-origin: 0 0;
        }

        .image-item {
            position: absolute;
            display: block;
            padding: 0;
            border: none;
            background: none;
            font: inherit;
            cursor: zoom-in;
        }

        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* never crop, even if a configured size is off */
            display: block;
        }

        /* Zoom overlay */
        #zoom-overlay {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 200;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: default;
        }

        #zoom-overlay.active {
            display: flex;
        }

        #zoom-overlay img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
        }

        #zoom-caption {
            margin-top: 20px;
            color: var(--accent);
            font-size: clamp(12px, 1.5vw, 20px);
            text-align: center;
        }

        /* Arrow navigation buttons */
        .zoom-arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--accent);
            font-size: clamp(16px, 2vw, 28px);
            width: 40px;
            height: 40px;
            cursor: pointer;
            z-index: 201;
            display: none;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .zoom-arrow:hover { color: var(--ink); }
        .zoom-arrow.visible { display: flex; }

        #prev-arrow { left: 20px; }
        #next-arrow { right: 20px; }

        #escape-hint {
            position: fixed;
            top: var(--gutter);
            right: var(--gutter);
            color: var(--accent);
            font-family: var(--font);
            font-size: var(--size-small);
            background: none;
            border: none;
            cursor: pointer;
            z-index: 201;
            display: none;
        }

        #escape-hint.visible { display: block; }

        /* Desktop: hide mobile captions */
        .mobile-caption { display: none; }

        /* Mobile styles */
        @media (max-width: 768px) {
            body {
                cursor: default;
                overflow-y: auto;
                overflow-x: hidden;
            }

            body.grabbing { cursor: default; }

            #canvas-container {
                width: 100vw;
                height: auto;
                position: relative;
                overflow: visible;
            }

            #canvas {
                width: 100vw;
                height: auto;
                position: relative;
                transform: none !important;
                transition: none;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 80px 20px 40px;
                gap: 40px;
                z-index: 1;
            }

            .image-item {
                position: relative !important;
                left: 0 !important;
                top: 0 !important;
                width: 90vw !important;
                height: auto !important;
                max-width: 500px;
                cursor: default;
            }

            .image-item img {
                width: 100%;
                height: auto;
                object-fit: contain;
            }

            .mobile-caption {
                display: block !important;
                margin-top: 10px;
                color: var(--accent);
                font-size: 12px;
                text-align: center;
                padding: 0 10px;
            }

            .zoom-arrow { display: none !important; }
            #zoom-overlay { display: none !important; }
            #escape-hint { display: none !important; }
        }
    </style>

<body>

    <main id="main" tabindex="-1">

    <script>
        // ========================================
        // CONFIGURE YOUR IMAGES HERE
        // ========================================
        const images = [
            { src: 'imgs/illustration/IMG_0024.jpg', width: 420, height: 560, caption: 'acrylic on skateboard' },
            { src: 'imgs/animation/cervest_animation_folder.gif', width: 400, height: 225, caption: 'motion design internship, adobe aftereffects' },
            { src: 'imgs/id/box.jpg', width: 400, height: 438, caption: '6 identical puzzle pieces that slide into a cube, cnc router + prototyping' },
            { src: 'imgs/illustration/I_miss_empty_nesting.png', width: 450, height: 338, alt: 'illustration: i miss empty nesting' },
            { src: 'imgs/illustration/I-m_Sick_Of_This_Clean_Air.png', width: 380, height: 285, alt: "illustration: i'm sick of this clean air" },
            { src: 'imgs/illustration/Phase_4_Can-t_Come_Quicker.png', width: 500, height: 375, alt: "illustration: phase 4 can't come quicker" },
            { src: 'imgs/illustration/kegshirts5.png', width: 420, height: 560, caption: 'solo business for sold-out tees, procreate' },
        ];
        // How much bigger items are drawn than the sizes above
        const ITEM_SCALE = 1.5;
        // ========================================

        const canvas = document.getElementById('canvas');
        const canvasContainer = document.getElementById('canvas-container');

        let scale = 1;
        let isDragging = false;
        let startX, startY;
        let currentX = 0, currentY = 0;
        let currentZoomIndex = -1;
        let isMobile = window.innerWidth <= 768;

        // Minimum empty space between any two images, in canvas px
        const GAP = 60;
        const placedRects = [];

        function overlapsPlaced(r) {
            return placedRects.some(p =>
                r.x < p.x + p.w + GAP && r.x + r.w + GAP > p.x &&
                r.y < p.y + p.h + GAP && r.y + r.h + GAP > p.y
            );
        }

        // Scatter items around the canvas centre, packed fairly tight so the
        // fit-to-screen zoom can stay close in. Each candidate spot is checked
        // against everything already placed; if it collides we try again a
        // little further out, so a free spot is always found.
        function placeItem(index, total, w, h) {
            const center = 2000;
            const slice = (Math.PI * 2) / total;
            const baseAngle = index * slice;
            for (let attempt = 0; ; attempt++) {
                const angle = baseAngle + (Math.random() - 0.5) * slice;
                const radius = 100 + attempt * 8 + Math.random() * 250;
                const rect = {
                    // Wider than tall, to match a landscape screen
                    x: center + Math.cos(angle) * radius * 1.6 - w / 2,
                    y: center + Math.sin(angle) * radius - h / 2,
                    w, h
                };
                if (!overlapsPlaced(rect)) {
                    placedRects.push(rect);
                    return rect;
                }
            }
        }

        images.forEach((img, index) => {
            const pos = placeItem(index, images.length, img.width * ITEM_SCALE, img.height * ITEM_SCALE);
            const imageEl = document.createElement('button');
            imageEl.type = 'button';
            imageEl.className = 'image-item';
            imageEl.style.left = `${pos.x}px`;
            imageEl.style.top = `${pos.y}px`;
            imageEl.style.width = `${img.width * ITEM_SCALE}px`;
            imageEl.style.height = `${img.height * ITEM_SCALE}px`;

            const imgTag = document.createElement('img');
            imgTag.src = img.src;
            imgTag.alt = img.alt || img.caption || '';
            imgTag.draggable = false;
            imageEl.appendChild(imgTag);

            if (img.caption) {
                const captionEl = document.createElement('div');
                captionEl.className = 'mobile-caption';
                captionEl.textContent = img.caption;
                imageEl.appendChild(captionEl);
            }

            canvas.appendChild(imageEl);

            imageEl.addEventListener('click', (e) => {
                if (!isMobile) { e.stopPropagation(); showZoomedImage(index); }
            });
        });

        function updateTransform() {
            canvas.style.transform = `translate(${currentX}px, ${currentY}px) scale(${scale})`;
        }

        canvasContainer.addEventListener('mousedown', (e) => {
            if (isMobile || e.target.closest('.image-item')) return;
            isDragging = true;
            startX = e.clientX - currentX;
            startY = e.clientY - currentY;
            document.body.classList.add('grabbing');
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging || isMobile) return;
            currentX = e.clientX - startX;
            currentY = e.clientY - startY;
            updateTransform();
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            document.body.classList.remove('grabbing');
        });

        const zoomOverlay = document.getElementById('zoom-overlay');
        const zoomImage = document.getElementById('zoom-image');
        const zoomCaption = document.getElementById('zoom-caption');
        const escapeHint = document.getElementById('escape-hint');
        const prevArrow = document.getElementById('prev-arrow');
        const nextArrow = document.getElementById('next-arrow');

        let returnFocusTo = null;

        function showZoomedImage(index) {
            if (isMobile) return;
            if (currentZoomIndex < 0) returnFocusTo = document.activeElement;
            currentZoomIndex = index;
            const img = images[index];
            zoomImage.src = img.src;
            zoomImage.alt = img.alt || img.caption || '';
            zoomCaption.textContent = img.caption || '';
            zoomOverlay.classList.add('active');
            escapeHint.classList.add('visible');
            prevArrow.classList.add('visible');
            nextArrow.classList.add('visible');
            escapeHint.focus();
        }

        function hideZoomedImage() {
            zoomOverlay.classList.remove('active');
            escapeHint.classList.remove('visible');
            prevArrow.classList.remove('visible');
            nextArrow.classList.remove('visible');
            zoomImage.removeAttribute('src');
            zoomCaption.textContent = '';
            const wasOpen = currentZoomIndex >= 0;
            currentZoomIndex = -1;
            if (wasOpen && returnFocusTo) returnFocusTo.focus();
        }

        escapeHint.addEventListener('click', hideZoomedImage);

        function showNextImage() {
            if (currentZoomIndex >= 0) {
                currentZoomIndex = (currentZoomIndex + 1) % images.length;
                showZoomedImage(currentZoomIndex);
            }
        }

        function showPreviousImage() {
            if (currentZoomIndex >= 0) {
                currentZoomIndex = (currentZoomIndex - 1 + images.length) % images.length;
                showZoomedImage(currentZoomIndex);
            }
        }

        zoomOverlay.addEventListener('click', (e) => {
            if (e.target === zoomOverlay) hideZoomedImage();
        });

        prevArrow.addEventListener('click', (e) => { e.stopPropagation(); showPreviousImage(); });
        nextArrow.addEventListener('click', (e) => { e.stopPropagation(); showNextImage(); });

        function centerToShowAllImages() {
            if (isMobile) return;
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            let baseMaxX = -Infinity, baseMaxY = -Infinity;
            document.querySelectorAll('.image-item').forEach(el => {
                const left = parseFloat(el.style.left);
                const top = parseFloat(el.style.top);
                const w = parseFloat(el.style.width);
                const h = parseFloat(el.style.height);
                minX = Math.min(minX, left);
                minY = Math.min(minY, top);
                maxX = Math.max(maxX, left + w);
                maxY = Math.max(maxY, top + h);
                baseMaxX = Math.max(baseMaxX, left + w / ITEM_SCALE);
                baseMaxY = Math.max(baseMaxY, top + h / ITEM_SCALE);
            });
            const contentCenterX = (minX + maxX) / 2;
            const contentCenterY = (minY + maxY) / 2;
            // Zoom as if items were their configured size, so ITEM_SCALE really
            // makes them bigger on screen, unless that would push any off screen
            const baseFit = Math.min(window.innerWidth / (baseMaxX - minX), window.innerHeight / (baseMaxY - minY)) * 0.9;
            const actualFit = Math.min(window.innerWidth / (maxX - minX), window.innerHeight / (maxY - minY));
            scale = Math.min(baseFit, actualFit);
            currentX = window.innerWidth / 2 - contentCenterX * scale;
            currentY = window.innerHeight / 2 - contentCenterY * scale;
            updateTransform();
        }

        centerToShowAllImages();

        window.addEventListener('resize', () => {
            isMobile = window.innerWidth <= 768;
            centerToShowAllImages();
        });

        document.querySelectorAll('img').forEach(img => {
            img.addEventListener('dragstart', (e) => e.preventDefault());
        });

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'Escape') { hideZoomedImage(); return; }
            if (currentZoomIndex >= 0) {
                if (e.key === 'ArrowLeft') { showPreviousImage(); return; }
                if (e.key === 'ArrowRight') { showNextImage(); return; }
                if (e.key === 'Tab') {
                    // Keep focus inside the open dialog
                    const controls = [escapeHint, prevArrow, nextArrow];
                    const i = controls.indexOf(document.activeElement);
                    const next = (i + (e.shiftKey ? -1 : 1) + controls.length) % controls.length;
                    controls[next].focus();
                    e.preventDefault();
                }
                // Don't let number keys navigate away while the dialog is open
                if (/^[0-9]$/.test(e.key)) e.preventDefault();
            }
        });
    </script>
