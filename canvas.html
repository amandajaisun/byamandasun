<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: white;
            overflow: hidden;
            cursor: grab;
            user-select: none;
            font-family: 'DM Sans', sans-serif;
        }

        body.grabbing {
            cursor: grabbing;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        #canvas {
            width: 4000px;
            height: 4000px;
            position: absolute;
            top: 0;
            left: 0;
            transition: transform 0.05s ease-out;
            transform-origin: 0 0;
        }

        .image-item {
            position: absolute;
        }

        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Navigation */
        #nav-pane {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 16px;
            z-index: 100;
            line-height: 1;
        }

        .nav-item {
            text-decoration: none;
            color: #607466;
            font-size: clamp(14px, 2.5vw, 32px);
            font-family: 'DM Sans', sans-serif;
            transition: color 0.2s;
            cursor: pointer;
        }

        .nav-item.active {
            color: #343E3D;
        }

        /* Signature */
        #signature {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #343E3D;
            font-size: clamp(14px, 2.5vw, 32px);
            font-family: 'DM Sans', sans-serif;
            z-index: 100;
            line-height: 1;
        }

        /* Zoom overlay */
        #zoom-overlay {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 200;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: default;
        }

        #zoom-overlay.active {
            display: flex;
        }

        #zoom-overlay img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
        }

        #zoom-caption {
            margin-top: 20px;
            color: #607466;
            font-size: clamp(12px, 1.5vw, 20px);
            text-align: center;
        }

        /* Arrow navigation buttons */
        .zoom-arrow {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #607466;
            font-size: clamp(16px, 2vw, 28px);
            width: 40px;
            height: 40px;
            cursor: pointer;
            z-index: 201;
            display: none;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .zoom-arrow:hover { color: #343E3D; }
        .zoom-arrow.visible { display: flex; }

        #prev-arrow { left: 20px; }
        #next-arrow { right: 20px; }

        #escape-hint {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #607466;
            font-size: clamp(10px, 1vw, 14px);
            font-family: 'DM Sans', sans-serif;
            z-index: 201;
            display: none;
        }

        #escape-hint.visible { display: block; }

        /* Desktop: hide mobile captions */
        .mobile-caption { display: none; }

        /* Mobile styles */
        @media (max-width: 768px) {
            body {
                cursor: default;
                overflow-y: auto;
                overflow-x: hidden;
            }

            body.grabbing { cursor: default; }

            #canvas-container {
                width: 100vw;
                height: auto;
                position: relative;
                overflow: visible;
            }

            #canvas {
                width: 100vw;
                height: auto;
                position: relative;
                transform: none !important;
                transition: none;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 80px 20px 40px;
                gap: 40px;
                z-index: 1;
            }

            .image-item {
                position: relative !important;
                left: 0 !important;
                top: 0 !important;
                width: 90vw !important;
                height: auto !important;
                max-width: 500px;
                cursor: default;
            }

            .image-item img {
                width: 100%;
                height: auto;
                object-fit: contain;
            }

            .mobile-caption {
                display: block !important;
                margin-top: 10px;
                color: #607466;
                font-size: 12px;
                text-align: center;
                padding: 0 10px;
            }

            .nav-item { font-size: 14px; }
            #signature { font-size: 14px; }
            .zoom-arrow { display: none !important; }
            #zoom-overlay { display: none !important; }
            #escape-hint { display: none !important; }
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div id="canvas"></div>
    </div>

    <!-- Zoom overlay -->
    <div id="zoom-overlay">
        <img id="zoom-image" src="" alt="">
        <div id="zoom-caption"></div>
    </div>

    <!-- Arrow navigation -->
    <button id="prev-arrow" class="zoom-arrow">←</button>
    <button id="next-arrow" class="zoom-arrow">→</button>

    <!-- Escape hint -->
    <div id="escape-hint">hit esc</div>

    <!-- Navigation Pane -->
    <nav id="nav-pane">
        <a href="index.html" class="nav-item" data-key="1">1</a>
        <a href="canvas.html" class="nav-item active" data-key="2">2</a>
        <a href="links.html" class="nav-item" data-key="3">3</a>
    </nav>

    <!-- Signature -->
    <div id="signature">amanda sun</div>

    <script>
        // ========================================
        // CONFIGURE YOUR IMAGES HERE
        // ========================================
        const images = [
            { src: 'imgs/illustration/IMG_0024.jpg', width: 420, height: 600, caption: 'acrylic on skateboard' },
            { src: 'imgs/animation/cervest_animation_folder.gif', width: 400, height: 400, caption: 'motion design internship, adobe aftereffects' },
            { src: 'imgs/id/box.jpg', width: 400, height: 400, caption: '6 identical puzzle pieces that slide into a cube, cnc router + prototyping' },
            { src: 'imgs/illustration/I_miss_empty_nesting.png', width: 450, height: 350 },
            { src: 'imgs/illustration/I-m_Sick_Of_This_Clean_Air.png', width: 380, height: 420 },
            { src: 'imgs/illustration/Phase_4_Can-t_Come_Quicker.png', width: 500, height: 600 },
            { src: 'imgs/illustration/kegshirts5.png', width: 420, height: 320, caption: 'solo business for sold-out tees, procreate' },
        ];
        // ========================================

        const canvas = document.getElementById('canvas');
        const canvasContainer = document.getElementById('canvas-container');

        let scale = 1;
        let isDragging = false;
        let startX, startY;
        let currentX = 0, currentY = 0;
        let currentZoomIndex = -1;
        let isMobile = window.innerWidth <= 768;

        function getRandomPosition(index, total) {
            const canvasSize = 4000;
            const angle = (index / total) * Math.PI * 2;
            const radius = 600 + Math.random() * 800;
            return {
                x: canvasSize / 2 + Math.cos(angle) * radius + (Math.random() - 0.5) * 400,
                y: canvasSize / 2 + Math.sin(angle) * radius + (Math.random() - 0.5) * 400
            };
        }

        images.forEach((img, index) => {
            const pos = getRandomPosition(index, images.length);
            const imageEl = document.createElement('div');
            imageEl.className = 'image-item';
            imageEl.style.left = `${pos.x}px`;
            imageEl.style.top = `${pos.y}px`;
            imageEl.style.width = `${img.width}px`;
            imageEl.style.height = `${img.height}px`;

            const imgTag = document.createElement('img');
            imgTag.src = img.src;
            imgTag.alt = `Image ${index + 1}`;
            imgTag.draggable = false;
            imageEl.appendChild(imgTag);

            if (img.caption) {
                const captionEl = document.createElement('div');
                captionEl.className = 'mobile-caption';
                captionEl.textContent = img.caption;
                imageEl.appendChild(captionEl);
            }

            canvas.appendChild(imageEl);

            imageEl.addEventListener('click', (e) => {
                if (!isMobile) { e.stopPropagation(); showZoomedImage(index); }
            });
        });

        function updateTransform() {
            canvas.style.transform = `translate(${currentX}px, ${currentY}px) scale(${scale})`;
        }

        canvasContainer.addEventListener('mousedown', (e) => {
            if (isMobile || e.target.closest('.image-item')) return;
            isDragging = true;
            startX = e.clientX - currentX;
            startY = e.clientY - currentY;
            document.body.classList.add('grabbing');
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging || isMobile) return;
            currentX = e.clientX - startX;
            currentY = e.clientY - startY;
            updateTransform();
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            document.body.classList.remove('grabbing');
        });

        const zoomOverlay = document.getElementById('zoom-overlay');
        const zoomImage = document.getElementById('zoom-image');
        const zoomCaption = document.getElementById('zoom-caption');
        const escapeHint = document.getElementById('escape-hint');
        const prevArrow = document.getElementById('prev-arrow');
        const nextArrow = document.getElementById('next-arrow');

        function showZoomedImage(index) {
            if (isMobile) return;
            currentZoomIndex = index;
            const img = images[index];
            zoomImage.src = img.src;
            zoomCaption.textContent = img.caption || '';
            zoomOverlay.classList.add('active');
            escapeHint.classList.add('visible');
            prevArrow.classList.add('visible');
            nextArrow.classList.add('visible');
        }

        function hideZoomedImage() {
            zoomOverlay.classList.remove('active');
            escapeHint.classList.remove('visible');
            prevArrow.classList.remove('visible');
            nextArrow.classList.remove('visible');
            zoomImage.src = '';
            zoomCaption.textContent = '';
            currentZoomIndex = -1;
        }

        function showNextImage() {
            if (currentZoomIndex >= 0) {
                currentZoomIndex = (currentZoomIndex + 1) % images.length;
                showZoomedImage(currentZoomIndex);
            }
        }

        function showPreviousImage() {
            if (currentZoomIndex >= 0) {
                currentZoomIndex = (currentZoomIndex - 1 + images.length) % images.length;
                showZoomedImage(currentZoomIndex);
            }
        }

        zoomOverlay.addEventListener('click', (e) => {
            if (e.target === zoomOverlay) hideZoomedImage();
        });

        prevArrow.addEventListener('click', (e) => { e.stopPropagation(); showPreviousImage(); });
        nextArrow.addEventListener('click', (e) => { e.stopPropagation(); showNextImage(); });

        function centerToShowAllImages() {
            if (isMobile) return;
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            document.querySelectorAll('.image-item').forEach(el => {
                const left = parseFloat(el.style.left);
                const top = parseFloat(el.style.top);
                const w = parseFloat(el.style.width);
                const h = parseFloat(el.style.height);
                minX = Math.min(minX, left);
                minY = Math.min(minY, top);
                maxX = Math.max(maxX, left + w);
                maxY = Math.max(maxY, top + h);
            });
            const contentCenterX = (minX + maxX) / 2;
            const contentCenterY = (minY + maxY) / 2;
            const scaleX = window.innerWidth / (maxX - minX);
            const scaleY = window.innerHeight / (maxY - minY);
            scale = Math.min(scaleX, scaleY) * 0.9;
            currentX = window.innerWidth / 2 - contentCenterX * scale;
            currentY = window.innerHeight / 2 - contentCenterY * scale;
            updateTransform();
        }

        centerToShowAllImages();

        window.addEventListener('resize', () => {
            isMobile = window.innerWidth <= 768;
            centerToShowAllImages();
        });

        document.querySelectorAll('img').forEach(img => {
            img.addEventListener('dragstart', (e) => e.preventDefault());
        });

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'Escape') { hideZoomedImage(); return; }
            if (currentZoomIndex >= 0) {
                if (e.key === 'ArrowLeft') { showPreviousImage(); return; }
                if (e.key === 'ArrowRight') { showNextImage(); return; }
            }
            document.querySelectorAll('.nav-item').forEach(item => {
                if (item.dataset.key === e.key) window.location.href = item.href;
            });
        });
    </script>
</body>
</html>
